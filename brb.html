<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Be Right Back - Event Horizon</title>
  <link rel="stylesheet" href="brb.css">
  <link rel="stylesheet" href="runtime/motion.css">
  <link rel="stylesheet" href="runtime/audio-session.css">
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div id="blackholeLayer" aria-hidden="true"></div>

  <div class="overlay">
    <p class="eyebrow">Transmission Pause</p>
    <h1 id="title">BE RIGHT BACK</h1>
    <p id="datetime" class="datetime" aria-live="off"></p>
    <p id="subtitle">Crossing the event horizon. Return imminent.</p>
  </div>

  <p id="bootError" class="boot-error" hidden>Scene bootstrap could not load. Keep the runtime folder next to this page.</p>

  <script src="config.js"></script>
  <script src="runtime/snapshots.js" onerror="document.getElementById('bootError').hidden = false"></script>
  <script src="runtime/settings.js" onerror="document.getElementById('bootError').hidden = false"></script>
  <script src="runtime/overlay.js" onerror="document.getElementById('bootError').hidden = false"></script>
  <script src="runtime/audio.js" onerror="document.getElementById('bootError').hidden = false"></script>
  <script src="runtime/audio-session.js" onerror="document.getElementById('bootError').hidden = false"></script>
  <script src="runtime/recovery.js" onerror="document.getElementById('bootError').hidden = false"></script>
  <script src="runtime/boot.js" data-scene="brb" onerror="document.getElementById('bootError').hidden = false"></script>
</body>
</html>
